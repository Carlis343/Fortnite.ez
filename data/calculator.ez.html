<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Vacía</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f17;
            --header-bg: rgba(19, 26, 38, 0);
            --section-bg: #1a2332;
            --card-bg: #0f172a;
            --card-hover: #1e293b;
            --accent: #facc15;
            --text: #94a3b8;
            --text-white: #f8fafc;
            --vbucks: #38bdf8;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        /* Footer natural al final de la página */
        footer {
            background-color: #131a26;
            border-top: 1px solid #2d3748;
            padding: 16px 22px;
            text-align: center;
            color: var(--text);
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        footer p {
            margin: 3px 0;
        }

        footer a {
            color: var(--vbucks);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }

        footer .creator {
            color: var(--text-white);
        }

        footer .copyright {
            font-size: 0.72rem;
            opacity: 0.65;
        }
    </style>
</head>
<body>

    <main>
        <!-- Contenido principal vacío -->
    </main>

    <footer>
        <p>Datos proporcionados por <a href="https://fortnite-api.com/" target="_blank" rel="noopener noreferrer">Fortnite-API.com</a> | Creado por <strong class="creator">Carlis343</strong></p>
        <p class="copyright">© Fortnite y sus respectivos logotipos son marcas comerciales o marcas registradas de Epic Games, Inc. en EE. UU. y en otros lugares. Este sitio no está afiliado ni respaldado por Epic Games.</p>
    </footer>

</body>
</html>
