<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fortnite-api.com">

    <!-- SEO Principal -->

    <meta name="description" content="Consulta la tienda diaria de Fortnite hoy, objetos, precios en pavos (V-Bucks), cosméticos y rankings en tiempo real con FORTNITE.EZ por Carlis343.">
    <meta name="keywords" content="fortnite.ez, tienda fortnite hoy, tienda diaria fortnite, fortnite shop ez, objetos fortnite, rankings fortnite, carlis343">
    <meta name="author" content="Carlis343">
    <meta name="robots" content="index, follow">

    <!-- URL Canónica (Cambia la dirección si usas otro nombre de repositorio o dominio) -->

    <!-- Open Graph (Redes Sociales, WhatsApp, Discord) -->

    <meta property="og:title" content="FORTNITE.EZ | Tienda Diaria de Fortnite y Rankings">
    <meta property="og:description" content="Descubre la tienda diaria de Fortnite con filtros avanzados, cosméticos y rankings actualizados en tiempo real.">
    <meta property="og:url" content="https://carlis343.github.io/Fortnite/">

    <meta property="og:image" content="https://fortnite-api.com/images/cosmetics/br/emoji_tomatohead/smallicon.png">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="FORTNITE.EZ | Tienda Diaria de Fortnite">
    <meta name="twitter:description" content="Consulta la tienda diaria de Fortnite, precios de pavos y rankings en tiempo real.">
    <meta name="twitter:image" content="https://fortnite-api.com/images/cosmetics/br/emoji_tomatohead/smallicon.png">

    <!-- Datos Estructurados Schema.org para Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FORTNITE.EZ",
      "url": "https://carlis343.github.io/Fortnite/",
      "author": {
        "@type": "Person",
        "name": "Carlis343"
      },
      "description": "Consulta la tienda diaria de Fortnite, objetos, precios, cosméticos y rankings en tiempo real."
    }
    </script>

    <!-- Ícono de la pestaña del navegador (Favicon) -->
    <link id="favicon" rel="icon" type="image/png" href="https://fortnite-api.com/images/cosmetics/br/emoji_tomatohead/smallicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f17;
            --header-bg: #131a26;
            --text-white: #f8fafc;
            --text-dim: #94a3b8;
            --vbucks: #38bdf8;
            --accent-red: #ff3b3b;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 2px solid #2d3748;
            padding: 16px 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex-shrink: 0;
            z-index: 100;
        }

        .navbar-inner {
            width: 100%;
            max-width: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-white);
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-highlight {
            color: var(--accent-red);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--text-white);
        }

        .nav-btn.active {
            color: var(--accent-red);
        }

        #content-container {
            flex: 1;
            width: 100%;
            display: flex;
        }

        #content-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar-inner">
            <a href="#" class="nav-logo">
                <img id="logo-img" src="https://fortnite-api.com/images/cosmetics/br/emoji_tomatohead/smallicon.png" alt="Icono Tomatohead Fortnite" class="logo-icon">
                <span>FORTNITE<span class="logo-highlight">.EZ</span></span>
            </a>
            <nav class="nav-menu">
                <button id="btn-shop" class="nav-btn active">tienda</button>
                <button id="btn-rankings" class="nav-btn">rankings</button>
                <button id="btn-calculator" class="nav-btn">calculadora</button>
            </nav>
        </div>
    </header>

    <main id="content-container">
        <iframe id="main-iframe" src="data/shop.ez.html" title="Tienda Fortnite"></iframe>
    </main>

    <script>
        async function fetchTomatoheadEmoji() {
            try {
                const response = await fetch('https://fortnite-api.com/v2/cosmetics/br/search?name=Tomatohead&type=emoji');
                const result = await response.json();
                
                if (result.status === 200 && result.data && result.data.images) {
                    const iconUrl = result.data.images.smallIcon || result.data.images.icon;
                    document.getElementById('logo-img').src = iconUrl;
                    document.getElementById('favicon').href = iconUrl;
                }
            } catch (error) {
                console.error('Error al consultar la API de Fortnite:', error);
            }
        }

        fetchTomatoheadEmoji();

        const btnShop = document.getElementById('btn-shop');
        const btnRankings = document.getElementById('btn-rankings');
        const btnCalculator = document.getElementById('btn-calculator');
        const iframe = document.getElementById('main-iframe');

        btnShop.addEventListener('click', () => {
            btnShop.classList.add('active');
            btnRankings.classList.remove('active');
            btnCalculator.classList.remove('active');
            
            iframe.style.display = 'block';
            iframe.src = 'data/shop.ez.html';
        });

        btnRankings.addEventListener('click', () => {
            btnRankings.classList.add('active');
            btnShop.classList.remove('active');
            btnCalculator.classList.remove('active');
            
            iframe.style.display = 'none';
            iframe.src = 'about:blank';
        });

        btnCalculator.addEventListener('click', () => {
            btnCalculator.classList.add('active');
            btnShop.classList.remove('active');
            btnRankings.classList.remove('active');
            
            iframe.style.display = 'none';
            iframe.src = 'about:blank';
        });
    </script>

</body>
</html>
