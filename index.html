<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Básico -->
    <title>FORTNITE.EZ</title>
    <meta name="description" content="Consulta la tienda diaria de Fortnite, objetos, precios, cosméticos y rankings en tiempo real con FORTNITE.EZ por Carlis343.">
    <meta name="keywords" content="fortnite.ez, fortnite-ez, fortniteez, fortnite carlis343, netlify fortnite.ez, tienda fortnite, tienda fortnite hoy, fortnite shop ez, carlis343">
    <meta name="author" content="Carlis343">
    <meta name="robots" content="index, follow">

    <!-- Open Graph (Redes Sociales / WhatsApp / Discord / Twitter) -->
    <meta property="og:title" content="FORTNITE.EZ">
    <meta property="og:description" content="Descubre la tienda diaria de Fortnite con filtros avanzados, cosméticos y rankings actualizados.">
    <meta property="og:url" content="https://fortnite-ez.netlify.app/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://fortnite-api.com/images/cosmetics/br/emoji_tomatohead/smallicon.png">

    <!-- Ícono de la pestaña del navegador (Favicon) -->
    <link id="favicon" rel="icon" type="image/png" href="https://fortnite-api.com/images/cosmetics/br/emoji_tomatohead/smallicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f17;
            --header-bg: #131a26;
            --text-white: #f8fafc;
            --text-dim: #94a3b8;
            --vbucks: #38bdf8;
            --accent-red: #ff3b3b;
        }

        * { box-sizing: border-box; }

        /* Mantiene la ventana ajustada al 100% sin scroll externo */
        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
        }

        /* Navbar superior */
        header {
            background-color: var(--header-bg);
            border-bottom: 2px solid #2d3748;
            padding: 16px 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex-shrink: 0;
            z-index: 100;
            position: relative;
        }

        .navbar-inner {
            width: 100%;
            max-width: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-white);
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-highlight {
            color: var(--accent-red);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        /* Botón de Menú Hamburguesa */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 101;
        }

        .hamburger-btn span {
            width: 100%;
            height: 3px;
            background-color: var(--text-white);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--text-white);
        }

        .nav-btn.active {
            color: var(--accent-red);
        }

        /* Contenedor adaptativo */
        #content-container {
            flex: 1;
            width: 100%;
            display: flex;
        }

        #content-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Estilos Adaptativos para Móviles */
        @media (max-width: 768px) {
            .hamburger-btn {
                display: flex;
            }

            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--header-bg);
                flex-direction: column;
                gap: 0;
                border-bottom: 2px solid #2d3748;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-out;
            }

            .nav-menu.open {
                max-height: 250px;
            }

            .nav-btn {
                width: 100%;
                text-align: center;
                padding: 15px 0;
                border-top: 1px solid #1e293b;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar-inner">
            <a id="nav-logo-btn" class="nav-logo">
                <img id="logo-img" src="https://fortnite-api.com/images/cosmetics/br/emoji_tomatohead/smallicon.png" alt="Tomatohead Emoji" class="logo-icon">
                <span>FORTNITE<span class="logo-highlight">.EZ</span></span>
            </a>

            <!-- Botón Hamburguesa Móvil -->
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-menu" id="nav-menu">
                <button id="btn-shop" class="nav-btn active">tienda</button>
                <button id="btn-rankings" class="nav-btn">rankings</button>
                <button id="btn-calculator" class="nav-btn">calculadoras</button>
            </nav>
        </div>
    </header>

    <main id="content-container">
        <!-- Inicia cargando la tienda desde la carpeta data/ -->
        <iframe id="main-iframe" src="data/shop.ez.html" title="Tienda Fortnite"></iframe>
    </main>

    <script>
        // Búsqueda específica del emoticono en la API
        async function fetchTomatoheadEmoji() {
            try {
                const response = await fetch('https://fortnite-api.com/v2/cosmetics/br/search?name=Tomatohead&type=emoji');
                const result = await response.json();
                
                if (result.status === 200 && result.data && result.data.images) {
                    const iconUrl = result.data.images.smallIcon || result.data.images.icon;
                    document.getElementById('logo-img').src = iconUrl;
                    document.getElementById('favicon').href = iconUrl;
                }
            } catch (error) {
                console.error('Error al consultar la API de Fortnite:', error);
            }
        }

        fetchTomatoheadEmoji();

        const btnShop = document.getElementById('btn-shop');
        const btnRankings = document.getElementById('btn-rankings');
        const btnCalculator = document.getElementById('btn-calculator');
        const navLogoBtn = document.getElementById('nav-logo-btn');
        const iframe = document.getElementById('main-iframe');

        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navMenu = document.getElementById('nav-menu');

        // Función auxiliar para cerrar menú hamburguesa en móvil al pulsar una opción
        function closeMobileMenu() {
            navMenu.classList.remove('open');
        }

        // Toggle del Menú Hamburguesa
        hamburgerBtn.addEventListener('click', () => {
            navMenu.classList.toggle('open');
        });

        // Evento al pulsar en el Logo (Carga Tienda en PC y Móvil)
        navLogoBtn.addEventListener('click', () => {
            btnShop.classList.add('active');
            btnRankings.classList.remove('active');
            btnCalculator.classList.remove('active');
            
            iframe.style.display = 'block';
            iframe.src = 'data/shop.ez.html';
            closeMobileMenu();
        });

        // Evento al pulsar "Tienda"
        btnShop.addEventListener('click', () => {
            btnShop.classList.add('active');
            btnRankings.classList.remove('active');
            btnCalculator.classList.remove('active');
            
            iframe.style.display = 'block';
            iframe.src = 'data/shop.ez.html';
            closeMobileMenu();
        });

        // Evento al pulsar "Rankings"
        btnRankings.addEventListener('click', () => {
            btnRankings.classList.add('active');
            btnShop.classList.remove('active');
            btnCalculator.classList.remove('active');
            
            iframe.style.display = 'block';
            iframe.src = 'data/rankings.ez.html';
            closeMobileMenu();
        });

        // Evento al pulsar "Calculadoras"
        btnCalculator.addEventListener('click', () => {
            btnCalculator.classList.add('active');
            btnShop.classList.remove('active');
            btnRankings.classList.remove('active');
            
            iframe.style.display = 'block';
            iframe.src = 'data/calculator.ez.html';
            closeMobileMenu();
        });
    </script>

</body>
</html>
